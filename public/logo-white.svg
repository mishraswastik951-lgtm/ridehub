<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Motorcycle Body & Silhouette - White Monochrome for Dark Sections -->
  <!-- Handlebars -->
  <path d="M 230 145 L 255 130 L 265 137" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="225" y="140" width="22" height="10" rx="3" fill="#FFFFFF" transform="rotate(-30 236 145)"/>

  <!-- Headlight / Windshield Visor -->
  <path d="M 270 135 L 295 155 L 285 175 Z" fill="#FFFFFF"/>

  <!-- Front Wheel Fork & Steering Stem -->
  <path d="M 260 145 L 320 205" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>

  <!-- Front Wheel (Outer White Ring) -->
  <circle cx="315" cy="205" r="35" fill="none" stroke="#FFFFFF" stroke-width="15"/>
  <!-- Front Wheel (Inner Hub) -->
  <circle cx="315" cy="205" r="20" fill="#FFFFFF" opacity="0.65"/>

  <!-- Main Bike Body Chassis -->
  <path d="M 255 160 C 275 160 285 180 270 205 L 275 260 L 240 260 L 240 215 L 180 230 L 150 205 C 200 200 225 175 255 160 Z" fill="#FFFFFF"/>

  <!-- Rear Wheel as Location Pin -->
  <path d="M 210 275 C 210 245 175 245 175 275 C 175 305 210 335 210 335 C 210 335 245 305 245 275 C 245 245 210 245 210 275 Z" fill="#FFFFFF"/>
  <!-- Center cutout for pin (transparent or dark navy cutout) -->
  <circle cx="210" cy="275" r="12" fill="#0F1F3D"/>

  <!-- Brand Text "RideHub" with exact light 'Ride' and bold 'Hub' -->
  <text x="75" y="415" font-family="'Bricolage Grotesque', system-ui, sans-serif" font-weight="300" font-size="78" fill="#FFFFFF" letter-spacing="-1px">Ride</text>
  <text x="250" y="415" font-family="'Bricolage Grotesque', system-ui, sans-serif" font-weight="800" font-size="78" fill="#FFFFFF" letter-spacing="-1px">Hub</text>
</svg>
